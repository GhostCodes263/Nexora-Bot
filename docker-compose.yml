# Optional: only for running on a computer. Not needed for Render.
services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bot:bot@db:5432/bot
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    ports: ["8080:8080"]
  db:
    image: postgres:16
    environment: {POSTGRES_USER: bot, POSTGRES_PASSWORD: bot, POSTGRES_DB: bot}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
volumes:
  pgdata:
